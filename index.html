<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TV Wall Planner — Dev Harness</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  #harness-error {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 99999;
    background: #b00020; color: #fff; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    padding: 12px 16px; white-space: pre-wrap; display: none;
    max-height: 40vh; overflow: auto;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="harness-error"></div>
<script>
  const errBox = document.getElementById('harness-error');
  function showErr(msg) {
    errBox.style.display = 'block';
    errBox.textContent = msg;
    console.error(msg);
  }
  window.addEventListener('error', (e) => showErr('Window error: ' + (e.message || e.error || e)));
  window.addEventListener('unhandledrejection', (e) =>
    showErr('Unhandled rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason)));

  (async () => {
    try {
      const src = await (await fetch('tv-wall-planner.tsx?ts=' + Date.now())).text();
      // Strip the import-from-react line (we provide React/hooks globally below)
      // and convert "export default function App" -> "function App", then bind to window.
      let patched = src
        .replace(/^\s*import\s+\{[^}]*\}\s+from\s+["']react["'];?\s*$/m, '')
        .replace(/export\s+default\s+function\s+App/, 'function App');
      patched += '\nwindow.App = App;\n';

      const out = Babel.transform(patched, {
        presets: [
          ['typescript', { allExtensions: true, isTSX: true }],
          ['react', { runtime: 'classic' }],
        ],
        filename: 'tv-wall-planner.tsx',
      }).code;

      // Bring React + hooks into scope of the evaluated code
      const { useState, useMemo, useRef, useEffect } = React;
      // eslint-disable-next-line no-eval
      (new Function('React', 'useState', 'useMemo', 'useRef', 'useEffect', 'window', out))
        (React, useState, useMemo, useRef, useEffect, window);

      if (!window.App) { showErr('App did not register on window after transpile.'); return; }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(window.App));
    } catch (err) {
      showErr('Boot error: ' + (err && err.stack ? err.stack : err));
    }
  })();
</script>
</body>
</html>
